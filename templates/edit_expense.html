{% extends "base.html" %}

{% block content %}

<div class="form-card">
    <div class="form-header">
        <div class="form-icon">✏️</div>
        <div>
            <h2>Edit Expense</h2>
            <p class="form-subtitle">Update your expense details and keep your records accurate.</p>
        </div>
    </div>

    <form method="POST" class="form-grid">
        <div class="form-group full-width">
            <label class="form-label" for="category">Category</label>
            <input id="category" type="text" name="category" value="{{ expense.category }}" class="form-control" required>
        </div>

        <div class="form-group full-width">
            <label class="form-label" for="amount">Amount</label>
            <input id="amount" type="number" step="0.01" name="amount" value="{{ expense.amount }}" class="form-control" required>
        </div>

        <div class="form-group full-width">
            <label class="form-label" for="description">Description</label>
            <input id="description" type="text" name="description" value="{{ expense.description }}" class="form-control">
        </div>

        <div class="form-group full-width">
            <button type="submit" class="btn btn-success btn-lg w-100">Update Expense</button>
        </div>
    </form>
</div>

{% endblock %}
