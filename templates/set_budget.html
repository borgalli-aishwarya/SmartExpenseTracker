{% extends "base.html" %}

{% block content %}

<div class="form-card">
    <div class="form-header">
        <div class="form-icon">📅</div>
        <div>
            <h2>Set Budget</h2>
            <p class="form-subtitle">Define your monthly budget and stay on track with your expenses.</p>
        </div>
    </div>

    <form method="POST" class="form-grid">
            <div class="form-group">
            <label class="form-label" for="budget_amount">Budget Amount</label>
            <input id="budget_amount" type="number" inputmode="numeric" step="1" min="1" name="budget_amount" class="form-control" placeholder="Enter amount" required />
            
        </div>

        <div class="form-group">
            <label class="form-label" for="month">Month</label>
            <select id="month" name="month" class="form-select" required>
                <option value="">Select Month</option>
                <option>January</option>
                <option>February</option>
                <option>March</option>
                <option>April</option>
                <option>May</option>
                <option>June</option>
                <option>July</option>
                <option>August</option>
                <option>September</option>
                <option>October</option>
                <option>November</option>
                <option>December</option>
            </select>
        </div>

        <div class="form-group full-width">
            <button type="submit" class="btn btn-success btn-lg w-100">Save Budget</button>
        </div>
    </form>

    {% if success_message %}
    <div class="success-message">✅ {{ success_message }}</div>
    {% endif %}
</div>

{% endblock %}
