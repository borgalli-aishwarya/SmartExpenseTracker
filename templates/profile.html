{% extends "base.html" %}

{% block content %}
<div class="profile-page">
    <div class="profile-card">
        <div class="profile-card-header">
            <h2>Your Profile</h2>
            <p class="text-muted">This page shows your account details.</p>
        </div>
        {% if success_message %}
        <div class="success-message">{{ success_message }}</div>
        {% elif error_message %}
        <div class="error-message">{{ error_message }}</div>
        {% endif %}

        <form method="POST" class="profile-form">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" type="text" id="username" name="username" value="{{ user.username }}" required />
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" name="email" value="{{ user.email }}" required />
            </div>
            <div class="form-group">
                <label class="form-label" for="new_password">New Password</label>
                <input class="form-control" type="password" id="new_password" name="new_password" placeholder="Leave blank to keep current password" />
            </div>
            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm Password</label>
                <input class="form-control" type="password" id="confirm_password" name="confirm_password" placeholder="Repeat new password" />
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
