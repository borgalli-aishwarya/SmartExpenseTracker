{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Edit Expense</h2>

    <form method="POST">

        <input
            type="text"
            name="category"
            value="{{ expense.category }}"
            class="form-control mb-3"
            required>

        <input
            type="number"
            step="0.01"
            name="amount"
            value="{{ expense.amount }}"
            class="form-control mb-3"
            required>

        <input
            type="text"
            name="description"
            value="{{ expense.description }}"
            class="form-control mb-3">

        <button
            type="submit"
            class="btn btn-success">

            Update Expense

        </button>

    </form>

</div>

{% endblock %}
