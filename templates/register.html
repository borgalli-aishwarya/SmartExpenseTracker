{% extends 'base.html' %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="form-header">
            <div class="form-icon">📝</div>
            <div>
                <h2>Create your account</h2>
                <p class="form-subtitle">Register now to track expenses, budgets, and monthly spending with ease.</p>
            </div>
        </div>

        {% if error_message %}
        <div class="error-message">{{ error_message }}</div>
        {% endif %}

        <form method="POST" autocomplete="off">
            <input type="text" name="prevent_autofill_username" id="prevent_autofill_username" style="position:absolute; left:-9999px; top:-9999px;" tabindex="-1" autocomplete="off">
            <input type="password" name="prevent_autofill_password" id="prevent_autofill_password" style="position:absolute; left:-9999px; top:-9999px;" tabindex="-1" autocomplete="off">

            <div class="form-group full-width">
                <label class="form-label" for="username">Username</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Choose a username" autocomplete="off" required>
            </div>

            <div class="form-group full-width">
                <label class="form-label" for="email">Email</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="Email address" autocomplete="off" required>
            </div>

            <div class="form-group full-width">
                <label class="form-label" for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Create a password" autocomplete="off" required>
            </div>

            <div class="form-group full-width">
                <button type="submit" class="btn btn-primary btn-lg w-100">Register</button>
            </div>
        </form>

        <p class="muted-text text-center">Already have an account? <a href="/login">Login</a></p>
    </div>
</div>
{% endblock %}
