{% extends "base.html" %}

{% block content %}

<div class="form-card">
    <div class="form-header">
        <div class="form-icon">📅</div>
        <div>
            <h2>Set Budget</h2>
            <p class="form-subtitle">Define your monthly budget and stay on track with your expenses.</p>
        </div>
    </div>

    <form method="POST" class="form-grid">
            <div class="form-group">
            <label class="form-label" for="budget_amount">Budget Amount</label>
            <input id="budget_amount" type="number" inputmode="numeric" step="1" min="1" name="budget_amount" class="form-control" placeholder="Enter amount" required />
            
        </div>

        <div class="form-group">
            <label class="form-label" for="month">Month & Year</label>
            <input id="month" type="month" name="month" class="form-control" value="{{ selected_month }}" required />
        </div>

        <div class="form-group full-width">
            <button type="submit" class="btn btn-primary btn-lg w-100">Save Budget</button>
        </div>
    </form>

    {% if success_message %}
    <div class="success-message">✅ {{ success_message }}</div>
    {% endif %}
</div>

{% endblock %}
